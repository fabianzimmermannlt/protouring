<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ProTouring – offline</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0a1026;color:#e8ecf7;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      text-align:center;padding:24px;-webkit-text-size-adjust:100%}
    .card{max-width:340px}
    .badge{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#111a3a,#0a1026);
      display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
      font-size:40px;font-weight:700;color:#e8ecf7;letter-spacing:-2px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:14px;line-height:1.5;color:#9fb0d9;margin:0 0 20px}
    button{background:#4f6ef7;color:#fff;border:0;border-radius:10px;padding:12px 20px;
      font-size:15px;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PT</div>
    <h1>Keine Verbindung</h1>
    <p>ProTouring braucht gerade Internet. Sobald du wieder Empfang hast, tippe auf „Erneut versuchen".</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
