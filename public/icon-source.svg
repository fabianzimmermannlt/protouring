<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ProTouring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#0a1026"/>
    </linearGradient>
  </defs>
  <!-- Vollflächiger Hintergrund (maskable-tauglich) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Monogramm PT im sicheren Zentrum -->
  <g fill="#e8ecf7" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <text x="512" y="600" font-size="470" text-anchor="middle" letter-spacing="-20">PT</text>
  </g>
  <!-- Blauer Routen-Akzent -->
  <rect x="330" y="690" width="364" height="34" rx="17" fill="#4f6ef7"/>
  <circle cx="330" cy="707" r="30" fill="#4f6ef7"/>
  <circle cx="694" cy="707" r="30" fill="#8aa0ff"/>
</svg>
