name: Deploy to Hetzner

# Automatisch deployen wenn auf 'main' gepusht wird
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # erlaubt dem automatischen GITHUB_TOKEN, das Repo zu lesen

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "── [1/5] Code aktualisieren ──────────────────"
            cd /var/www/protouring
            # Frisches, kurzlebiges Actions-Token statt gespeichertem Server-Token
            # (läuft nie ab, weil bei jedem Deploy neu erzeugt).
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
            git reset --hard FETCH_HEAD

            echo "── [2/5] Env aktualisieren ───────────────────"
            grep -q "NEXT_PUBLIC_GEOAPIFY_KEY" .env.local 2>/dev/null || echo "NEXT_PUBLIC_GEOAPIFY_KEY=fd5eb442dd624f3d912f16d0491e0232" >> .env.local

            echo "── [3/5] Abhängigkeiten installieren ─────────"
            rm -rf node_modules
            npm ci
            echo "── [3b/5] Server-Abhängigkeiten (Backend) ────"
            cd server && npm install --omit=dev && cd ..

            echo "── [4/5] Build ───────────────────────────────"
            npm run build

            echo "── [5/5] App neu starten ─────────────────────"
            pm2 restart ecosystem.config.js --update-env

            echo "── [6/5] Status prüfen ───────────────────────"
            pm2 status

            echo "✓ Deploy erfolgreich: $(date '+%Y-%m-%d %H:%M:%S')"
